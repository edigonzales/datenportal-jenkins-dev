jenkins:
  systemMessage: "Datenportal Jenkins"
  numExecutors: 2
  mode: NORMAL
  scmCheckoutRetryCount: 1

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin"
        - id: "seed-user"
          password: "seed"
        - id: "read-user"
          password: "read"
        - id: "afu-user"
          password: "afu"
        - id: "statistikdienst-user"
          password: "statistikdienst"

  authorizationStrategy:
    projectMatrix:
      entries:
        - user:
            name: "admin"
            permissions:
              - "Overall/Administer"
        - user:
            name: "seed-user"
            permissions:
              - "Overall/Read"
        - user:
            name: "read-user"
            permissions:
              - "Overall/Read"
        - user:
            name: "afu-user"
            permissions:
              - "Overall/Read"
        - user:
            name: "statistikdienst-user"
            permissions:
              - "Overall/Read"

unclassified:
  location:
    url: "http://localhost:8080/"
    adminAddress: "Local Jenkins <noreply@localhost>"
  gretlDatenportalJobs:
    displayName: "GRETL Datenportal Jobs"
    urlName: "gretl-datenportal"
    topicRepositoryMode: "${THEMEN_REPO_MODE}"
    topicRepositoryUrl: "${THEMEN_REPO_URL}"
    topicRepositoryBranch: "${THEMEN_REPO_BRANCH}"
    topicRepositoryPath: "${THEMEN_REPO_PATH}"
    seedJobAutoCreate: true
    seedJobCron: "H/15 * * * *"
    seedJobBuildsToKeep: 20
    seedJobOperatorsTeam: "gretl-datenportal-seed-operators"
