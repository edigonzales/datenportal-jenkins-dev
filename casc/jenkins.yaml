jenkins:
  systemMessage: "Datenportal Jenkins"
  numExecutors: 2
  mode: NORMAL
  scmCheckoutRetryCount: 1

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin"
        - id: "seed-user"
          password: "seed"
        - id: "read-user"
          password: "read"
        - id: "agi-user"
          password: "agi"
        - id: "mfk-user"
          password: "mfk"
        - id: "statistikdienst-user"
          password: "statistikdienst"

  authorizationStrategy:
    projectMatrix:
      entries:
        - user:
            name: "admin"
            permissions:
              - "Overall/Administer"
        - user:
            name: "seed-user"
            permissions:
              - "Overall/Read"
        - user:
            name: "read-user"
            permissions:
              - "Overall/Read"
        - user:
            name: "agi-user"
            permissions:
              - "Overall/Read"
        - user:
            name: "mfk-user"
            permissions:
              - "Overall/Read"
        - user:
            name: "statistikdienst-user"
            permissions:
              - "Overall/Read"

unclassified:
  lockableResourcesManager:
    declaredResources:
      - name: "datenportal-topic-repository"
  location:
    url: "${JENKINS_URL}"
    adminAddress: "Local Jenkins <noreply@localhost>"
  gretlDatenportalJobs:
    displayName: "Datenportal Jobs"
    urlName: "gretl-datenportal"
    topicRepositoryMode: "${THEMEN_REPO_MODE}"
    topicRepositoryUrl: "${THEMEN_REPO_URL}"
    topicRepositoryBranch: "${THEMEN_REPO_BRANCH}"
    topicRepositoryPath: "${THEMEN_REPO_PATH}"
    topicRepositoryCredentialsId: "${THEMEN_REPO_CREDENTIALS_ID:-}"
    topicRepositoryWriteBackEnabled: "${THEMEN_REPO_WRITE_BACK_ENABLED:-false}"
    topicRepositoryCommitterName: "${THEMEN_REPO_COMMITTER_NAME:-}"
    topicRepositoryCommitterEmail: "${THEMEN_REPO_COMMITTER_EMAIL:-}"
    seedJobAutoCreate: true
    seedJobCron: "H/15 * * * *"
    seedJobBuildsToKeep: 20
    seedJobOperatorsTeam: "gretl-datenportal-seed-operators"

tool:
  git:
    installations:
      - name: "Default"
        home: "git"
