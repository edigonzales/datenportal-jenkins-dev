jenkins:
  systemMessage: "Local GRETL Datenportal Jenkins"
  numExecutors: 2
  mode: NORMAL
  scmCheckoutRetryCount: 1

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8080/"
    adminAddress: "Local Jenkins <noreply@localhost>"
  gretlDatenportalJobs:
    displayName: "GRETL Datenportal Jobs"
    urlName: "gretl-datenportal"
    topicRepositoryUrl: "${THEMEN_REPO_URL}"
    topicRepositoryBranch: "${THEMEN_REPO_BRANCH}"
    topicRepositoryPath: ""
    seedJobAutoCreate: true
    seedJobCron: "H/15 * * * *"
    seedJobBuildsToKeep: 20
